name: Gyant
description: Gyant was a San Francisco-based digital health company that built an AI-powered
  conversational virtual assistant for health systems, guiding patients through symptom
  checking, care navigation, and triage across web and messaging channels. In 2022 Gyant
  was acquired by Fabric (fabrichealth.com), and gyant.com now redirects to Fabric's
  healthcare care-access platform, which combines conversational AI with physician-built
  clinical protocols for virtual care, patient engagement, and clinical automation. Gyant
  does not publish a public API, developer portal, or SDKs; this profile captures the
  company's identity, published legal/compliance surface, and domain security posture.
